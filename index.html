!<div class="detail" id="dWallet"><p>Wallet coming soon.</p></div>
<div class="row" onclick="toggleDetail('dPass')"><span class="icon">🔒</span><span class="label">Passwords</span><span class="val" id="passVal">0 items</span><span class="arrow">›</span></div>
<div class="detail" id="dPass"><input id="passInput" placeholder="e.g. Facebook - hint"><button type="button" onclick="saveField('passwords')">Save Item</button><p id="passList"></p></div>
</div>
<div class="card"><div class="row" onclick="toggleDetail('dLocation')"><span class="icon">📍</span><span class="label">Location</span><span class="val" id="locVal">Set up</span><span class="arrow">›</span></div><div class="detail" id="dLocation"><input id="locInput" placeholder="e.g. Cape Town"><button type="button" onclick="saveField('location')">Save Location</button></div></div>
</div>

<div class="top"><button type="button" id="menuBtn">☰</button><b id="logoArea">JP AI</b><span></span></div>
<div id="keysBox" class="keys"><b>Your Key</b><br><small>Saved only in YOUR browser.</small><br><input id="myKey" type="password" placeholder="Paste Your Key Here"><button type="button" id="saveBtn">Save Key and Hide Forever</button><span id="keyStatus" style="font-size:12px;color:#90EE90"></span></div>
<p class="hint" id="memoryHint">Memory: 0 chats</p>
<div id="chat"></div>
<div class="modes"><button type="button" id="chatModeBtn" class="active">💬 Chat</button><button type="button" id="imageModeBtn">🖼️ Image</button></div>
<div class="input"><input id="q" placeholder="Ask anything..."><button type="button" id="sendBtn">Send</button></div>

<script>
// --- MAKE IT AN APP (PWA) ---
var deferredPrompt = null;
var manifest = {name:"JP AI", short_name:"JP AI", description:"My Personal AI", start_url:".", display:"standalone", background_color:"#000000", theme_color:"#000000", icons:[{src:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='black'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='%2390EE90' font-family='Arial' font-weight='bold'>JP</text></svg>", sizes:"512x512", type:"image/svg+xml", purpose:"any"}]};
var blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
var manifestURL = URL.createObjectURL(blob);
var link = document.createElement("link"); link.rel = "manifest"; link.href = manifestURL; document.head.appendChild(link);
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredPrompt = e; document.getElementById("installBar").classList.add("show"); });
function installApp(){ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(function(){ deferredPrompt=null; document.getElementById("installBar").classList.remove("show"); }); } else { alert("To install:\n\nOn Android Chrome:\nTap ⋮ top right > Add to Home Screen > Install\n\nOn iPhone Safari:\nTap Share ⬆️ > Add to Home Screen"); } }
document.getElementById("installBtn2").onclick = installApp;
if(window.matchMedia("(display-mode: standalone)").matches){ document.getElementById("installBar").classList.remove("show"); }

// --- APP LOGIC ---
var conversations = []; var activeId = null; var logoTaps = 0; var searchTerm = ""; var mode = "chat";
var settings = JSON.parse(localStorage.getItem("jp_settings") || '{"personality":"Professional","email":"","calendar":"","contacts":"","location":"","passwords":[],"plugins":{"image":true,"memory":true,"fun":false}}');
function saveSettings(){ localStorage.setItem("jp_settings", JSON.stringify(settings)); updateCustomUI(); }
function updateCustomUI(){ document.getElementById("personalityVal").innerText = settings.personality; document.getElementById("personalitySelect").value = settings.personality; document.getElementById("emailVal").innerText = settings.email ? "Saved" : "Set up"; document.getElementById("calVal").innerText = settings.calendar ? "Saved" : "Set up"; document.getElementById("contactVal").innerText = settings.contacts ? "Saved" : "Set up"; document.getElementById("locVal").innerText = settings.location ? settings.location : "Set up"; document.getElementById("passVal").innerText = settings.passwords.length + " items"; document.getElementById("passList").innerText = settings.passwords.join("\n"); document.getElementById("emailInput").value = settings.email; document.getElementById("calInput").value = settings.calendar; document.getElementById("contactInput").value = settings.contacts; document.getElementById("locInput").value = settings.location; document.getElementById("tglImage").className = "toggle " + (settings.plugins.image ? "on" : ""); document.getElementById("tglMemory").className = "toggle " + (settings.plugins.memory ? "on" : ""); document.getElementById("tglFun").className = "toggle " + (settings.plugins.fun ? "on" : ""); var cnt=0; settings.plugins.image && cnt++; settings.plugins.memory && cnt++; settings.plugins.fun && cnt++; document.getElementById("pluginVal").innerText = cnt + " added"; }
function toggleDetail(id){ document.getElementById(id).classList.toggle("open"); }
function togglePlugin(name, el){ settings.plugins[name] = !settings.plugins[name]; saveSettings(); }
function changePersonality(v){ settings.personality = v; saveSettings(); alert("Personality set to " + v); }
function saveField(type){ if(type=="email") settings.email = document.getElementById("emailInput").value.trim(); if(type=="calendar") settings.calendar = document.getElementById("calInput").value.trim(); if(type=="contacts") settings.contacts = document.getElementById("contactInput").value.trim(); if(type=="location") settings.location = document.getElementById("locInput").value.trim(); if(type=="passwords"){ var v = document.getElementById("passInput").value.trim(); if(v){ settings.passwords.push(v); document.getElementById("passInput").value=""; } } saveSettings(); alert("Saved!"); }
function clearAllMemory(){ if(confirm("Delete ALL chats and memory?")){ conversations=[]; localStorage.removeItem("jp_convs_5days"); var id=Date.now().toString(); conversations=[{id:id,title:"New Chat",time:Date.now(),messages:[{role:"assistant",content:"Hi Jade! Memory cleared.",time:Date.now()}]}]; activeId=id; saveAll(); renderList(); renderChat(); updateHint(); updateCustomUI(); } }
function saveAll(){ if(!settings.plugins.memory) return; localStorage.setItem("jp_convs_5days", JSON.stringify(conversations)); }
function loadAll(){ try{ var saved = JSON.parse(localStorage.getItem("jp_convs_5days") || "[]"); var now = Date.now(); var fiveDays = 5*24*60*60*1000; conversations = saved.filter(function(c){ return (now - (c.time||now)) < fiveDays; }); }catch(e){ conversations=[]; } if(conversations.length==0){ var id=Date.now().toString(); conversations=[{id:id,title:"New Chat",time:Date.now(),messages:[{role:"assistant",content:"Hi Jade! I am JP AI. Use 💬 Chat, 🖼️ Image, ⚙️ Customize. Tap Install to add me to your Home Screen.",time:Date.now()}]}]; activeId=id; } else { activeId=conversations[0].id; } updateHint(); }
function getActive(){ for(var i=0;i<conversations.length;i++){ if(conversations[i].id==activeId) return conversations[i]; } return conversations[0]; }
function updateHint(){ document.getElementById("memoryHint").innerText = "Memory: " + conversations.length + " chats saved - " + settings.personality + " mode"; document.getElementById("memoryVal").innerText = conversations.length + " chats"; document.getElementById("memoryDetailText").innerText = "You have " + conversations.length + " chats saved. Last 5 days."; }
function renderList(){ var list=document.getElementById("chatList"); list.innerHTML=""; var filtered=conversations.filter(function(c){ if(!searchTerm) return true; return c.title.toLowerCase().indexOf(searchTerm.toLowerCase())>-1; }); if(filtered.length==0){ list.innerHTML="<div class='empty'>No chats found</div>"; return; } filtered.forEach(function(c){ var b=document.createElement("div"); b.className="chatItem "+(c.id==activeId?"active":""); var s=document.createElement("span"); s.innerText=c.title; s.onclick=function(){ activeId=c.id; renderList(); renderChat(); closeSidebar(); }; var del=document.createElement("i"); del.innerText="✕"; del.onclick=function(e){ e.stopPropagation(); if(confirm("Delete this chat?")){ conversations=conversations.filter(function(x){ return x.id!=c.id; }); if(conversations.length==0){ var nid=Date.now().toString(); conversations.push({id:nid,title:"New Chat",time:Date.now(),messages:[{role:"assistant",content:"Hi Jade! Start a new chat.",time:Date.now()}]}); } activeId=conversations[0].id; saveAll(); renderList(); renderChat(); updateHint(); } }; b.appendChild(s); b.appendChild(del); list.appendChild(b); }); }
function formatDate(t){ var d=new Date(t); var today=new Date(); var yesterday=new Date(); yesterday.setDate(today.getDate()-1); if(d.toDateString()==today.toDateString()) return "Today"; if(d.toDateString()==yesterday.toDateString()) return "Yesterday"; return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(); }
function renderChat(){ var c=document.getElementById("chat"); c.innerHTML=""; var conv=getActive(); var lastDate=""; conv.messages.forEach(function(m){ var dateStr=formatDate(m.time||Date.now()); if(dateStr!=lastDate){ var sep=document.createElement("div"); sep.className="dateSep"; sep.innerText="--- "+dateStr+" ---"; c.appendChild(sep); lastDate=dateStr; } var d=document.createElement("div"); d.className="msg "+(m.role=="user"?"user":""); var who=(m.role=="user"?"You":"JP AI"); var html="<small>"+who+"</small>"+(m.content||"").split("\n").join("<br>"); if(m.imageUrl){ html+="<img src='"+m.imageUrl+"'><a class='dl' href='"+m.imageUrl+"' download='jp-ai-image.jpg' target='_blank'>⬇ Download Image</a>"; } d.innerHTML=html; c.appendChild(d); }); c.scrollTop=c.scrollHeight; }
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("overlay").classList.add("show"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); }
function saveKeys(){ var b=document.getElementById("myKey").value.trim(); if(!b){ document.getElementById("keyStatus").innerText="Paste your key first"; return; } localStorage.setItem("jp_key",b); document.getElementById("keysBox").style.display="none"; document.getElementById("myKey").value=""; }
function updateKeysUI(){ var b=localStorage.getItem("jp_key")||""; if(b){ document.getElementById("keysBox").style.display="none"; } else { document.getElementById("keysBox").style.display="block"; } }
function setMode(m){ mode=m; document.getElementById("chatModeBtn").className=(m=="chat"?"active":""); document.getElementById("imageModeBtn").className=(m=="image"?"active":""); document.getElementById("q").placeholder=(m=="image"?"Describe image... e.g. Black November poster":"Ask anything..."); }
function getPersonalityPrompt(){ if(settings.personality=="Friendly") return "You are JP AI, warm and friendly like a best friend."; if(settings.personality=="Funny") return "You are JP AI, very funny and playful."; if(settings.personality=="Motivational") return "You are JP AI, motivational coach. Hype up Jade."; if(settings.personality=="Short") return "You are JP AI. Answer in very short bullet points."; return "You are JP AI, professional assistant. User: Jade, Location: " + (settings.location||"Cape Town") + ", Email: " + (settings.email||"") + ", Calendar: " + (settings.calendar||"") + "."; }
async function send(){
  var q=document.getElementById("q"); var text=q.value.trim(); if(!text) return;
  var conv=getActive(); if(conv.title=="New Chat"||conv.messages.length<=1){ conv.title=text.slice(0,35); }
  conv.messages.push({role:"user",content:text,time:Date.now()}); q.value=""; renderChat(); renderList(); saveAll();
  if(mode=="image"){ if(!settings.plugins.image){ conv.messages.push({role:"assistant",content:"Image plugin is OFF. Turn it on in Customize > Plugins.",time:Date.now()}); renderChat(); return; } var thinking={role:"assistant",content:"🎨 Creating your image... please wait 10 seconds...",time:Date.now()}; conv.messages.push(thinking); renderChat(); var seed=Math.floor(Math.random()*1000000); var imgUrl="https://image.pollinations.ai/prompt/"+encodeURIComponent(text+", high quality, detailed, professional")+"?width=1024&height=1024&seed="+seed+"&nologo=true"; thinking.content="Here is your image for: "+text; thinking.imageUrl=imgUrl; renderChat(); renderList(); saveAll(); return; }
  var lower=text.toLowerCase(); if(lower.indexOf("create image")>-1||lower.indexOf("make image")>-1||lower.indexOf("generate image")>-1||lower.indexOf("create a poster")>-1){ setMode("image"); var t2={role:"assistant",content:"🎨 Switched to Image mode...",time:Date.now()}; conv.messages.push(t2); renderChat(); var s2=Math.floor(Math.random()*1000000); var u2="https://image.pollinations.ai/prompt/"+encodeURIComponent(text)+"?width=1024&height=1024&seed="+s2+"&nologo=true"; t2.content="Here is your image for: "+text; t2.imageUrl=u2; renderChat(); saveAll(); return; }
  var thinking={role:"assistant",content:"Thinking...",time:Date.now()}; conv.messages.push(thinking); renderChat();
  try{ var key=localStorage.getItem("jp_key"); if(!key) throw new Error("No key saved - tap JP AI logo 5 times to add key"); var msgs=[{role:"system",content:getPersonalityPrompt()}]; var recent=conv.messages.slice(-40); recent.forEach(function(c){ if(c.content.indexOf("Thinking")==0) return; if(c.content.indexOf("Error")==0) return; if(c.content.indexOf("Hi Jade")==0) return; if(c.imageUrl) return; msgs.push({role:c.role,content:c.content}); }); var r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},body:JSON.stringify({model:"openai/gpt-oss-120b",messages:msgs})}); var j=await r.json(); if(j.error) throw new Error(j.error.message); thinking.content=j.choices[0].message.content; }catch(e){ thinking.content="Error: "+e.message; }
  renderChat(); renderList(); saveAll();
}
document.getElementById("menuBtn").onclick=openSidebar;
document.getElementById("overlay").onclick=closeSidebar;
document.getElementById("newChatBtn").onclick=function(){ var id=Date.now().toString(); var conv={id:id,title:"New Chat",time:Date.now(),messages:[{role:"assistant",content:"Hi Jade! New chat started.",time:Date.now()}]}; conversations.unshift(conv); activeId=id; saveAll(); renderList(); renderChat(); updateHint(); closeSidebar(); };
document.getElementById("openCustomBtn").onclick=function(){ closeSidebar(); document.getElementById("customPanel").classList.add("show"); updateCustomUI(); };
document.getElementById("backCustom").onclick=function(){ document.getElementById("customPanel").classList.remove("show"); };
document.getElementById("searchBox").oninput=function(){ searchTerm=this.value; renderList(); };
document.getElementById("searchBtn").onclick=function(){ searchTerm=document.getElementById("searchBox").value; renderList(); };
document.getElementById("saveBtn").onclick=saveKeys;
document.getElementById("sendBtn").onclick=send;
document.getElementById("chatModeBtn").onclick=function(){ setMode("chat"); };
document.getElementById("imageModeBtn").onclick=function(){ setMode("image"); };
document.getElementById("q").onkeydown=function(e){ if(e.key=="Enter") send(); };
document.getElementById("logoArea").onclick=function(){ logoTaps++; if(logoTaps>=5){ logoTaps=0; document.getElementById("keysBox").style.display="block"; document.getElementById("myKey").value=localStorage.getItem("jp_key")||""; } setTimeout(function(){ logoTaps=0; },2000); };
document.getElementById("myKey").value=localStorage.getItem("jp_key")||"";
loadAll(); updateKeysUI(); renderList(); renderChat(); updateCustomUI();
</script>
</body>
</html>

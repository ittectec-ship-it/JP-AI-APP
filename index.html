<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JP AI</title>
<style>
body{font-family:sans-serif;background:#111;color:white;text-align:center;padding:15px;margin:0}
h1{font-size:28px}
.card{background:#222;padding:15px;border-radius:15px;margin:10px 0;text-align:left}
textarea{width:100%;padding:12px;border-radius:10px;border:none;margin:8px 0;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#FFD700;font-weight:bold;font-size:17px}
.msg{background:#333;padding:10px;border-radius:10px;margin:8px 0;text-align:left}
small{color:#aaa}
</style>
</head>
<body>
<h1>JP AI 🤖</h1>
<p>Chat with JP</p>

<div class="card">
<b>JP AI Chat</b>
<div id="chatBox"><div class="msg">Hi! I'm JP! Ask me anything 👇</div></div>
<textarea id="chatInput" placeholder="Ask JP anything..."></textarea>
<button onclick="askJP()">Send to JP</button>
</div>

<script>
function askJP(){
  let q=document.getElementById('chatInput').value;
  if(!q) return;
  let box=document.getElementById('chatBox');
  box.innerHTML+='<div class="msg"><b>You:</b> '+q+'</div>';
  box.innerHTML+='<div class="msg"><b>JP:</b> Cool question! I am JP AI - tell me what you want to build next and I will help you.</div>';
  document.getElementById('chatInput').value='';
}
</script>
</body>
</html>
